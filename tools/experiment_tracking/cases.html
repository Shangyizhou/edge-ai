<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>逐例评分 · 历史输出</title><style>body{background:#f4f6fa;color:#1c3047;font:16px/1.6 system-ui;margin:0}main{max-width:1100px;margin:auto;padding:24px}article{background:white;border:1px solid #dae4ef;border-radius:10px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6fb;padding:12px;font-size:14px}a{color:#165db6}input,select{padding:10px;margin:5px;border:1px solid #adbed2;border-radius:6px}.muted{color:#566d82}.bad{color:#b42e41}.ok{color:#147751}@media(max-width:650px){main{padding:12px}.grid{grid-template-columns:1fr}}</style><main><a href="/">← 返回参数与成绩表</a><h1 id="title"></h1><p class="muted">沿用历史评分，不重新生成或判分。参考回复不是唯一合法措辞；文字结论包含历史助手审核。</p><input id="search" placeholder="搜索输入、ID或工具"><select id="filter"><option value="all">全部</option><option value="bad">仅失败</option><option value="ok">仅通过</option></select><p id="count"></p><div id="rows"></div></main><script>
const D=__DATA__,key=new URLSearchParams(location.search).get('eval'),rows=D.case_records[key],E=(t,s)=>{let e=document.createElement(t);if(s!==undefined)e.textContent=s;return e};document.querySelector('#title').textContent=key||'请选择一份评测';function draw(){let host=document.querySelector('#rows');host.replaceChildren();if(!rows){host.append(E('p','未找到已导入逐例结果，请从成绩表选择。'));return}let search=document.querySelector('#search').value.toLowerCase(),filter=document.querySelector('#filter').value,n=0;rows.forEach(r=>{if(filter==='bad'&&r.pass||filter==='ok'&&!r.pass||search&&!JSON.stringify([r.id,r.user,r.actual,r.expected]).toLowerCase().includes(search))return;n++;let a=E('article');a.append(E('h3',r.id+' · '+r.user));let p=E('p',(r.pass?'通过':'失败')+' · '+(r.errors?.join(', ')||'无错误标签'));p.className=r.pass?'ok':'bad';a.append(p);if(D.quant.contexts[r.id])a.append(E('p','本题可用工具：'+D.quant.contexts[r.id].join(', ')));let grid=E('div');grid.className='grid';let expected=E('div'),actual=E('div');expected.append(E('strong','期望'),E('pre',r.expected.length?JSON.stringify(r.expected,null,2):'不调用工具\n'+r.target_content));actual.append(E('strong','实际输出'),E('pre',(r.actual.length?JSON.stringify(r.actual,null,2):'不调用工具')+(r.content?'\n\n'+r.content:'')));grid.append(expected,actual);a.append(grid);host.append(a)});document.querySelector('#count').textContent=n+' / '+rows.length+' 条'}document.querySelector('#search').oninput=draw;document.querySelector('#filter').oninput=draw;draw();
</script></html>
