name: Experiment tracking metadata
on:
  pull_request:
    paths:
      - 'tools/experiment_tracking/**'
      - 'docs/adr/**'
      - 'studies/voice-interaction/releases/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/experiment_tracking -v
