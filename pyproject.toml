[tool.ruff]
target-version = "py38"
line-length = 79
include = [
    "tools/edge_benchmark/**/*.py",
    "tools/experiment_tracking/record_execution.py",
    "tools/experiment_tracking/test_record_execution.py",
    "tools/qwen_lifecycle/benchmark.py",
    "tools/qwen_lifecycle/server_lifecycle.py",
    "pyproject.toml",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72
